services:
  onionintel:
    build: .
    image: robin:reliable-v1
    container_name: robin
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
      - "8501:8501"
    entrypoint:
      - /bin/bash
      - -lc
      - sed 's/\r$//' /app/entrypoint.sh > /tmp/entrypoint.sh && exec /bin/bash /tmp/entrypoint.sh
    volumes:
      - .:/app
      - ./investigations:/app/investigations
    restart: unless-stopped
